version: v2
plugins:
  - local: protoc-gen-go
    out: api/proto
    opt:
      - paths=source_relative

  - local: protoc-gen-go-grpc
    out: api/proto
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true

  - local: protoc-gen-grpc-gateway
    out: api/proto
    opt:
      - paths=source_relative

  - local: protoc-gen-openapiv2
    out: api/openapi
    opt:
      - output_format=json
      - allow_merge=true
      - merge_file_name=ledger