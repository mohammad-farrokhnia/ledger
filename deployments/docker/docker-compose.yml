services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ledger-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ledger.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ledger-pgadmin-data:/var/lib/pgadmin

  ledger:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: ledger-service
    restart: unless-stopped
    environment:
      DB_DSN: postgres://postgres:postgres@postgres:5432/ledger?sslmode=disable
      GRPC_PORT: "9090"
      HTTP_PORT: "8080"
      METRICS_PORT: "9091"
      LOG_LEVEL: info
    ports:
      - "9090:9090"
      - "8080:8080"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledger-postgres-data:
  ledger-pgadmin-data:
