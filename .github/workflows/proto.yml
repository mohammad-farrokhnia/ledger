name: Proto

on:
  pull_request:
    paths:
      - 'api/proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
  push:
    branches: [master, develop]
    paths:
      - 'api/proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
  workflow_dispatch:

jobs:
  lint:
    name: Buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          version: '1.34.0'
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
