syntax = "proto3";

package ledger.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/mohammad-farrokhnia/ledger/api/proto/ledger/v1;ledgerv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "ledger API"
    version: "1.0"
    description: "A high-consistency, bank-grade financial transaction service."
  }
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
};

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_USER = 1;
  ACCOUNT_TYPE_SYSTEM = 2;
  ACCOUNT_TYPE_PROVIDER = 3;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_COMPLETED = 2;
  TRANSACTION_STATUS_FAILED = 3;
}

message Wallet {
  string id = 1;
  string name = 2;
  AccountType type = 3;
  string currency_code = 4;
  int64 balance = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Transaction {
  string id = 1;
  string idempotency_key = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  int64 amount = 5;
  string currency_code = 6;
  TransactionStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Entry {
  string id = 1;
  string account_id = 2;
  string transaction_id = 3;
  int64 amount = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateWalletRequest {
  string name = 1;
  AccountType type = 2;
  string currency_code = 3;
}

message CreateWalletResponse {
  Wallet wallet = 1;
}

message GetBalanceRequest {
  string wallet_id = 1;
}

message GetBalanceResponse {
  string wallet_id = 1;
  int64 balance = 2;
  string currency_code = 3;
}

message CreateTransactionRequest {
  string idempotency_key = 1;
  string from_account_id = 2;
  string to_account_id = 3;
  int64 amount = 4;
  string currency_code = 5;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message GetWalletHistoryRequest {
  string wallet_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetWalletHistoryResponse {
  repeated Entry entries = 1;
  string next_page_token = 2;
}

service LedgerService {
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse) {
    option (google.api.http) = {
      post: "/v1/wallets"
      body: "*"
    };
  }

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (google.api.http) = {get: "/v1/wallets/{wallet_id}/balance"};
  }

  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/transactions"
      body: "*"
    };
  }

  rpc GetWalletHistory(GetWalletHistoryRequest) returns (GetWalletHistoryResponse) {
    option (google.api.http) = {get: "/v1/wallets/{wallet_id}/history"};
  }
}
